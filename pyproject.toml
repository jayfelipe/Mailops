[project]
name = "mailops"
version = "0.1.0"
description = "Email deliverability checks and mail ops tooling"
requires-python = ">=3.12"
dependencies = ["dnspython>=2.6", "psycopg[binary]>=3.2", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
mailops = "mailops.cli:main"

[tool.setuptools]
packages = ["mailops"]