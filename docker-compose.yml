services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailops
      POSTGRES_PASSWORD: mailops
      POSTGRES_DB: mailops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailops -d mailops"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MAILOPS_DSN: postgresql://mailops:mailops@db:5432/mailops
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "mailops.worker"]
    environment:
      MAILOPS_DSN: postgresql://mailops:mailops@db:5432/mailops
      MAILOPS_SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: