name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # installs the package AND its dev extras (pytest, ruff) straight
      # from pyproject.toml — this validates the packaging itself
      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: pytest -v